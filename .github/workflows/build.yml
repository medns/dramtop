name: Build & Release Static Binaries

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x86_64
            cc: gcc
            cflags: -O3 -Wall -Wextra -mavx2 -static -pthread
          - arch: aarch64
            cc: aarch64-linux-gnu-gcc
            cflags: -O3 -Wall -Wextra -static -pthread
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compilation toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross file

      - name: Build static binary (${{ matrix.arch }})
        run: |
          ${{ matrix.cc }} ${{ matrix.cflags }} dramtop.c -o dramtop-linux-${{ matrix.arch }} -pthread -lm
          strip dramtop-linux-${{ matrix.arch }} || true
          ls -lh dramtop-linux-${{ matrix.arch }}
          file dramtop-linux-${{ matrix.arch }}

      - name: Smoke test x86_64 binary
        if: matrix.arch == 'x86_64'
        run: |
          ./dramtop-linux-x86_64 --version
          ./dramtop-linux-x86_64 --help

      - name: Generate SHA256 checksum
        run: |
          sha256sum dramtop-linux-${{ matrix.arch }} > dramtop-linux-${{ matrix.arch }}.sha256

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dramtop-linux-${{ matrix.arch }}
          path: |
            dramtop-linux-${{ matrix.arch }}
            dramtop-linux-${{ matrix.arch }}.sha256

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/dramtop-linux-*
