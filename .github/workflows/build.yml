name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Warnings, unit tests and sanitizers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build and unit-test with GCC and Clang (-Werror)
        run: |
          for cc in gcc clang; do
            make clean
            make test accuracy CC=$cc CFLAGS="-O2 -Wall -Wextra -Wshadow -Wformat=2 -Werror"
          done

      - name: Unit tests under ASan + UBSan
        run: |
          # Newer runner kernels use more mmap entropy than older sanitizer runtimes expect.
          sudo sysctl -w vm.mmap_rnd_bits=28
          make clean
          make test CC=clang CFLAGS="-O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"

  build:
    name: Static binary (${{ matrix.arch }})
    needs: check
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Build with musl in Alpine
        run: |
          version=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; fi
          docker run --rm -v "$PWD:/src" -w /src -e VERSION="$version" alpine:3.22 sh -euc '
            apk add --no-cache build-base linux-headers > /dev/null
            make static VERSION="$VERSION" CFLAGS="-O2 -Wall -Wextra -Werror"
            make test CFLAGS="-O2 -Wall -Wextra -Werror"
          '
          mv dramtop-static dramtop-linux-${{ matrix.arch }}
          file dramtop-linux-${{ matrix.arch }}
          ls -l dramtop-linux-${{ matrix.arch }}

      - name: Smoke test
        run: |
          ./dramtop-linux-${{ matrix.arch }} --version
          ./dramtop-linux-${{ matrix.arch }} --help > /dev/null

      - uses: actions/upload-artifact@v7
        with:
          name: dramtop-linux-${{ matrix.arch }}
          path: dramtop-linux-${{ matrix.arch }}
          if-no-files-found: error

  macos:
    name: macOS binary (arm64)
    needs: check
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v7

      # Hosted runners are virtual machines without the memory controller counters, so only the build and unit tests run here.
      - name: Build and unit-test (-Werror)
        run: make test accuracy CFLAGS="-O2 -Wall -Wextra -Wshadow -Wformat=2 -Werror"

      - name: Build the release binary
        run: |
          version=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; fi
          make clean
          make VERSION="$version" CFLAGS="-O2 -Wall -Wextra -Werror"
          mv dramtop dramtop-macos-arm64
          file dramtop-macos-arm64
          ls -l dramtop-macos-arm64
          ./dramtop-macos-arm64 --version

      - uses: actions/upload-artifact@v7
        with:
          name: dramtop-macos-arm64
          path: dramtop-macos-arm64
          if-no-files-found: error

  windows:
    name: Windows binary (x86_64)
    needs: check
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - uses: ilammy/msvc-dev-cmd@v1

      # Hosted runners are virtual machines whose CPU counters ETW cannot use, so only the build and unit tests run here.
      - name: Build and unit-test (/WX)
        run: nmake /nologo /f Makefile.msvc test CFLAGS="/nologo /O2 /W4 /WX"

      - name: Build the release binary
        run: |
          $version = ""
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $version = $env:GITHUB_REF_NAME.Substring(1) }
          nmake /nologo /f Makefile.msvc clean
          nmake /nologo /f Makefile.msvc VERSION="$version" CFLAGS="/nologo /O2 /W4 /WX"
          Move-Item dramtop.exe dramtop-windows-x86_64.exe
          Get-Item dramtop-windows-x86_64.exe | Format-List Name, Length
          ./dramtop-windows-x86_64.exe --version

      - uses: actions/upload-artifact@v7
        with:
          name: dramtop-windows-x86_64
          path: dramtop-windows-x86_64.exe
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [build, macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum dramtop-linux-* dramtop-macos-* dramtop-windows-* > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/dramtop-linux-*
            dist/dramtop-macos-*
            dist/dramtop-windows-*
            dist/SHA256SUMS
